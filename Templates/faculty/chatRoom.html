<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty- Student Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: 500px;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid #ddd;
        }
        .message {
            padding: 10px;
            border-radius: 10px;
            max-width: 75%;
            margin-bottom: 10px;
        }
        .sender {
            background-color: #0d6efd;
            color: white;
            align-self: flex-end;
        }
        .receiver {
            background-color: #e9ecef;
            align-self: flex-start;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            Faculty- Student Chat
        </div>
        <div class="card-body d-flex flex-column chat-container">
            {% for chat in conversation %}
                <div class="message rounded mb-2 p-2">
                    <strong>{{ chat.sender_mail }}</strong><br>
                    {{ chat.text }}
                    {% if chat.share_files %}
                    <a href="{% url 'faculty:file_download_view' chat.id %}" class="text-warning">
                        Download File
                    </a>
                    {% endif %}
                    <div class="small text-muted text-end">{{ chat.timestamp|date:"M d, Y H:i" }}</div>
                </div>
            {% empty %}
                <p class="text-center text-muted">No messages yet.</p>
            {% endfor %}
        </div>
        <div class="card-footer">
            <form action="" method="post" enctype="multipart/form-data" class="d-flex">
                {% csrf_token %}
                <input type="file" name="share_files" class="form-control me-2">
                <textarea name="text" class="form-control me-2" rows="1" placeholder="Type your message..."></textarea>
                <button type="submit" class="btn btn-primary">Send</button>
            </form>
        </div>
        <a class="btn btn-primary mt-2" href="{% url 'faculty:facultyChatRoom' %}">Back</a>
    </div>
</div>
<script>
    const chatContainer = document.querySelector('.chat-container');
    chatContainer.scrollTop = chatContainer.scrollHeight;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
